name: Pipeline

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
        types: [opened, synchronize]

jobs:
    Test:
        runs-on: ubuntu-22.04
        steps:
            - name: Checkout
              uses: actions/checkout@v4
            - name: Install node.js
              uses: actions/setup-node@v4
            - name: Install dependencies
              run: npm install
            - name: Execute tests
              run: npm test
